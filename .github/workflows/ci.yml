name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q scripts tests vendor/toy_doctor.py
      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate onboarding skill
        run: python scripts/check_skill.py skills/toy-github
      - name: Precheck plain HTML starter
        run: python vendor/toy_doctor.py templates/html/site --slug ci-check --require-root-index --json

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [templates/vite, examples/react, examples/vue]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install and build
        working-directory: ${{ matrix.project }}
        run: |
          npm ci
          npm run build
      - name: Precheck static output
        run: python3 vendor/toy_doctor.py '${{ matrix.project }}/dist' --slug ci-check --require-root-index --json
